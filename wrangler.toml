name = "jobsearch-hq"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

# Who the site is about. Change these for your own copy.
[vars]
OWNER_NAME = "Chris Ihler"
OWNER_FIRST_NAME = "Chris"
OWNER_LOCATION = "Lynnwood, WA"
GITHUB_URL = "https://github.com/ChrisIhler"
LINKEDIN_URL = "https://www.linkedin.com/in/chrisihler"
REPO_URL = "https://github.com/ChrisIhler/jobsearch-hq"

[[d1_databases]]
binding = "DB"
database_name = "jobsearch-db"
database_id = "0082e8e5-fac4-44d4-8454-a1dd96af5970"

# Secrets (set with `wrangler secret put NAME`, never committed):
#   ADMIN_PASSWORD  - admin page password
#   SESSION_SECRET  - random string used to sign the admin session cookie
#   API_TOKEN       - bearer token the scheduled job-scan runs use to push roles
